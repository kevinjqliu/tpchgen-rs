name: Build Python Packages

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Whether to upload built distributions as artifacts"
        required: false
        default: false
        type: boolean

jobs:
  wheels:
    runs-on: ${{ matrix.build.runner }}
    strategy:
      matrix:
        package:
          - tpchgen-cli
          - tpcgen
        build:
          # Linux manylinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: x86
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: auto
            os: linux

          # Linux musllinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: x86
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: musllinux_1_2
            os: musllinux

          # Windows
          - runner: windows-latest
            target: x64
            os: windows
          - runner: windows-latest
            target: x86
            os: windows

          # macOS
          - runner: macos-14
            target: aarch64
            os: macos
          - runner: macos-15-intel
            target: x86_64
            os: macos

    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.build.target }}
          args: --release --out dist
          working-directory: ${{ matrix.package }}
          manylinux: ${{ matrix.build.manylinux || '' }}
      - name: Upload wheels
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.build.os }}-${{ matrix.build.target }}
          path: ${{ matrix.package }}/dist

  sdist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - tpchgen-cli
          - tpcgen
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ matrix.package }}
      - name: Upload sdist
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: sdist-${{ matrix.package }}
          path: ${{ matrix.package }}/dist
